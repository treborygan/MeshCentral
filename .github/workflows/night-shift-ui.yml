name: Night Shift UI checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/styles/custom.css"
      - "public/scripts/custom.js"
      - "public/scripts/night-shift/**"
      - "scripts/Install-NightShift.ps1"
      - "tests/Test-NightShiftInstaller.ps1"
      - "scripts/build-night-shift.js"
      - "tests/night-shift.test.cjs"
      - ".github/workflows/night-shift-ui.yml"
  push:
    branches: ["feature/night-shift-ui", "feature/night-shift-structural"]
    paths:
      - "public/styles/custom.css"
      - "public/scripts/custom.js"
      - "public/scripts/night-shift/**"
      - "scripts/Install-NightShift.ps1"
      - "tests/Test-NightShiftInstaller.ps1"
      - "scripts/build-night-shift.js"
      - "tests/night-shift.test.cjs"
      - ".github/workflows/night-shift-ui.yml"

permissions:
  contents: read

jobs:
  ui-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse theme JavaScript
        run: node --check public/scripts/custom.js
      - name: Verify generated script is current
        run: node scripts/build-night-shift.js --check
      - name: Run theme contract tests
        run: node --test tests/night-shift.test.cjs

  windows-installer-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Install-NightShift.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          Write-Host 'PowerShell syntax parsed successfully.'
      - name: Exercise installer and rollback in a disposable fixture
        shell: pwsh
        run: ./tests/Test-NightShiftInstaller.ps1
