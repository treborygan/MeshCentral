function eventsTab(){return `<div class="topline"><div class="subtle-label">Recent activity for ${html(dev().name)}</div>${btn('download-events','Export example','download','sm')}</div><section class="panel">${eventList()}</section>`}
function consoleTab(){return `<div class="split-notice">Agent console sends low-level commands to MeshAgent. This prototype does not run commands or connect to the agent.</div><div class="term"><div class="term-head">${icon('code',16)} MeshAgent console</div><div class="term-body"><div>MeshAgent console ready (demonstration).</div><div>Server-side agent communication is not connected.</div></div><div class="term-form" style="color:#7f919a">${icon('lock',14)} Input disabled in design preview</div></div>`}
function amtTab(){return `<div class="panel empty">${icon('server',30)}<strong>${dev().amt?'Intel AMT available':'Intel AMT not configured'}</strong><p>In the production interface this area retains hardware management, KVM, power and BIOS controls where supported. Device permissions and AMT provisioning determine availability.</p>${btn('about-amt','About AMT support','info')}</div>`}
function infoTab(){let d=dev();return `<section class="panel"><div class="panel-head"><h2>Hardware and agent details</h2></div><div class="property-list">${[['Device name',d.name],['Hostname',d.host],['Platform',d.os],['CPU',d.cpu],['RAM',d.memory],['Local network',d.ip],['Agent version',d.version],['Current connection',d.agent],['Intel AMT',d.amt?'Provisioned (example)':'Not available']].map(([k,v])=>`<div class="property"><span>${html(k)}</span><b>${html(v)}</b></div>`).join('')}</div></section>`}
function pluginsTab(){return `<div class="panel empty">${icon('layers',30)}<strong>Device extensions</strong><p>Plugin-provided tabs and controls will appear here dynamically. The redesign must preserve the MeshCentral plugin extension points.</p>${btn('about','View compatibility notes','info')}</div>`}
function groupsPage(){return `${heading('Device groups','Organize devices by purpose, site or responsibility.',btn('add-group','New group','plus','primary'))}<div class="groups-grid">${groups.map(g=>`<button data-group="${html(g.name)}" class="group-card"><div class="dev-icon">${icon(g.icon,19)}</div><h3>${html(g.name)}</h3><p>${html(g.desc)}</p><div class="count">${g.count} devices ${icon('arrowRight',13)}</div></button>`).join('')}</div>`}
function activityPage(){return `${heading('Activity','A timeline of device connections and administrative events.',btn('download-events','Export activity','download'))}<section class="panel"><div class="panel-head"><h2>Latest events</h2><span class="illustrative">Sample events</span></div>${eventList()}</section>`}
function recordingsPage(){return `${heading('Recordings','Review and manage saved remote sessions.',btn('about-recordings','Recording settings','settings'))}<section class="panel"><div class="panel-head"><h2>Saved sessions</h2><span class="subtle-label">Demo archive</span></div>${[['Studio Workstation','Remote desktop','Today · 12:41','04:21'],['Travel Laptop','Terminal','Yesterday · 16:18','02:08']].map(r=>`<div class="file-row" style="cursor:default"><span style="color:var(--accent)">${icon('play',19)}</span><span class="file-identity"><strong>${r[0]}</strong><small>${r[1]} · ${r[2]}</small></span><span class="file-size">${r[3]}</span><button class="btn sm" data-action="preview-recording">Preview</button></div>`).join('')}</section>`}
function usersPage(){return `${heading('Users','Manage access to this MeshCentral server.',btn('invite','Add user','plus','primary'))}<section class="panel"><div class="panel-head"><h2>Server users</h2><span class="illustrative">Example account</span></div><div class="file-row" style="cursor:default"><div class="avatar">AD</div><div class="file-identity"><strong>Administrator</strong><small>Full administrator · Enabled</small></div><span class="chip online">Active</span><button class="btn sm" data-action="user-rights">Permissions</button></div></section>`}
function userGroupsPage(){return `${heading('User groups','Assign permissions to teams instead of individual accounts.',btn('create-user-group','Create group','plus','primary'))}<div class="panel empty">${icon('users',30)}<strong>Organize permissions at scale</strong><p>A production MeshCentral instance can manage role access across device groups. This concept preserves those workflows.</p>${btn('create-user-group','Create sample group','plus')}</div>`}
function serverPage(){return `${heading('My server','Manage the MeshCentral instance, events and server-wide tools.',btn('server-options','Server actions','settings'))}<div class="groups-grid"><button class="group-card" data-action="server-status"><div class="dev-icon">${icon('server',19)}</div><h3>Server status</h3><p>Connectivity, health, traffic and connections.</p><div class="count">Open status ${icon('arrowRight',12)}</div></button><button class="group-card" data-action="server-files"><div class="dev-icon">${icon('folder',19)}</div><h3>Server files</h3><p>Files shared or stored on the management server.</p><div class="count">Open files ${icon('arrowRight',12)}</div></button><button class="group-card" data-action="server-plugins"><div class="dev-icon">${icon('layers',19)}</div><h3>Plugins</h3><p>Installed extensions and integration settings.</p><div class="count">Manage extensions ${icon('arrowRight',12)}</div></button><button class="group-card" data-action="server-trace"><div class="dev-icon">${icon('activity',19)}</div><h3>Server trace</h3><p>Diagnostic events, relay and connection inspection.</p><div class="count">Inspect logs ${icon('arrowRight',12)}</div></button></div>`}
function settingsPage(){return `${heading('Preferences','Personalize the interface without changing MeshCentral functionality.')}<div class="details-grid"><div class="panel"><div class="panel-head"><h2>Interface</h2></div><div class="property-list"><div class="property"><span>Design concept</span><select id="settingsConcept" style="padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text)"><option value="a" ${state.concept==='a'?'selected':''}>Common Ground</option><option value="b" ${state.concept==='b'?'selected':''}>Night Shift</option><option value="c" ${state.concept==='c'?'selected':''}>Blueprint</option></select></div><div class="property"><span>Device layout</span><b>${state.grid?'Grid':'List'}</b></div><div class="property"><span>Desktop quality</span><b>${state.quality}</b></div></div></div><div class="panel"><div class="panel-head"><h2>Security and sessions</h2></div><div class="property-list"><div class="property"><span>Server authentication</span><b>Preserved in implementation</b></div><div class="property"><span>Permission checks</span><b>Required for all operations</b></div><div class="property"><span>Prototype connection</span><b>Offline simulation</b></div></div></div></div>`}
function content(){return ({overview:overview,devices:devicesPage,device:devicePage,groups:groupsPage,activity:activityPage,recordings:recordingsPage,users:usersPage,usergroups:userGroupsPage,server:serverPage,settings:settingsPage})[state.route]?.()||devicesPage()}
function render(){app.dataset.concept=state.concept;app.classList.toggle('remote-view',state.route==='device'&&state.tab==='Desktop');app.innerHTML=`${sidebar()}<section class="main">${mobileTop()}${topbar()}<main class="page" id="page">${content()}</main>${dock()}</section>`;refreshSwitchers();if(state.tab==='Terminal'){const e=document.getElementById('termBody');if(e)e.scrollTop=e.scrollHeight}renderPortal()}
function refreshSwitchers(){document.querySelectorAll('[data-switch]').forEach(e=>{e.classList.toggle('active',e.dataset.switch===state.concept);e.setAttribute('aria-pressed',e.dataset.switch===state.concept)});document.querySelectorAll('[data-viewport]').forEach(e=>e.classList.toggle('active',e.dataset.viewport===state.viewport));preview.classList.toggle('is-phone',state.viewport!=='desktop');preview.classList.toggle('is-landscape',state.viewport==='landscape');}
function selectConcept(c){state.concept=c;state.connected=true;state.keyboard=false;state.zoom=1;state.panX=0;state.panY=0;state.search='';state.filter='All';state.grid=c==='c';state.route=c==='a'?'devices':c==='b'?'device':'overview';state.tab=c==='b'?'Desktop':'General';render()}
function openDevice(id,tab='General'){state.selected=id;state.route='device';state.tab=tab;state.keyboard=false;state.connected=devices.find(d=>d.id===id)?.online??false;state.zoom=1;state.panX=0;state.panY=0;render()}
function route(to){state.route=to;state.keyboard=false;render()}
function tab(to){state.tab=to;render()}
function setToast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=`${icon('info',15)}<span>${html(message)}</span>`;document.body.append(el);clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.remove(),3200)}
function modal(kind){state.modal=kind;state.modalQuery='';renderPortal()}
function renderPortal(){if(!state.modal){portal.innerHTML='';return}const close=`<button class="btn" data-action="close-modal">Close</button>`;if(state.modal==='search'){const q=state.modalQuery.toLowerCase();let rs=[...navMain,...navAdmin].filter(x=>x[1].toLowerCase().includes(q)).map(x=>({type:'nav',id:x[0],label:x[1],icon:x[2]})).concat(devices.filter(d=>d.name.toLowerCase().includes(q)||d.host.toLowerCase().includes(q)).map(d=>({type:'device',id:d.id,label:d.name,icon:deviceIcon(d)})));portal.innerHTML=`<div class="search-backdrop" data-overlay="true"><div class="command-dialog" role="dialog" aria-modal="true" aria-label="Quick search"><div class="command-search">${icon('search',20)}<input id="modalSearch" aria-label="Search devices and features" placeholder="Search devices, groups, actions…" value="${html(state.modalQuery)}" autocomplete="off"/><button class="icon-btn" data-action="close-modal" aria-label="Close search">${icon('x',17)}</button></div><div class="command-results">${rs.length?rs.slice(0,11).map(r=>`<button class="command-result" data-result="${r.type}:${r.id}">${icon(r.icon,17)}<span>${html(r.label)}</span><small class="muted">${r.type==='device'?'Device':'Section'}</small>${icon('chevron',13)}</button>`).join(''):`<div class="empty" style="padding:24px"><strong>No results</strong><p>Try a different search.</p></div>`}</div><div class="command-footer">Search is local to this interactive prototype. Press Esc to close.</div></div></div>`;setTimeout(()=>document.getElementById('modalSearch')?.focus(),0);return}
const configs={
 'connection-method':['Connection method','Choose how the browser should connect to this device. The preview does not establish a real session.',`<label for="methodSel">Desktop connection</label><select id="methodSel"><option value="Agent" ${state.method==='Agent'?'selected':''}>MeshAgent desktop</option><option value="RDP" ${state.method==='RDP'?'selected':''}>Browser RDP</option><option value="Intel AMT" ${state.method==='Intel AMT'?'selected':''} ${dev().amt?'':'disabled'}>Intel AMT KVM ${dev().amt?'':'(not configured)'}</option></select><div class="split-notice" style="margin-top:14px">Actual Agent desktop, RDP and Intel AMT transports use different capabilities and permissions. Each must be tested separately in the fork.</div><div class="sheet-actions"><button class="btn primary" data-action="save-method">Use this method</button></div>`],
 'remote-settings':['Remote desktop settings','Tune visual performance and interaction. Mobile controls remain available across quality presets.',`<label for="qualitySel">Image quality</label><select id="qualitySel"><option ${state.quality==='Balanced'?'selected':''}>Balanced</option><option ${state.quality==='Sharp text'?'selected':''}>Sharp text</option><option ${state.quality==='Low bandwidth'?'selected':''}>Low bandwidth</option></select><label for="fpsSel">Frame rate</label><select id="fpsSel"><option ${state.fps==='15 fps'?'selected':''}>15 fps</option><option ${state.fps==='30 fps'?'selected':''}>30 fps</option><option ${state.fps==='5 fps'?'selected':''}>5 fps</option></select>`],
 'special-keys':['Special keys','Simulated keyboard combinations. Only the interface is functional in this snapshot.',`<div class="action-grid" style="grid-template-columns:repeat(2,1fr);padding:6px 0">${['Ctrl + Alt + Del','Alt + Tab','Win + D','Ctrl + C','Ctrl + V','Esc'].map(x=>`<button class="action-tile" data-sendkey="${x}">${icon('keyboard',17)}${x}</button>`).join('')}</div>`],
 'power-options':['Power controls','Power actions are available only when permitted by the live server and device state.',`<div class="action-grid" style="grid-template-columns:repeat(2,1fr);padding:7px 0">${[['Wake device','power'],['Restart','refresh'],['Sleep','clock'],['Shut down','power']].map(([x,ic])=>`<button class="action-tile" data-demo="${x}">${icon(ic,19)}${x}</button>`).join('')}</div>`],
 'more-actions':['Device actions','Quick access to supported remote management controls.',`<div class="action-grid" style="grid-template-columns:repeat(2,1fr);padding:7px 0">${[['Screenshot','camera'],['Share session','link'],['Lock remote','lock'],['Send message','chat']].map(([x,ic])=>`<button class="action-tile" data-demo="${x}">${icon(ic,19)}${x}</button>`).join('')}</div>`],
 'more-nav':['All sections','Access every management area on your phone.',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${[...navMain,...navAdmin].map(n=>`<button class="btn" style="justify-content:flex-start;min-height:45px" data-modalnav="${n[0]}">${icon(n[2],17)}${n[1]}</button>`).join('')}</div>`],
 'notifications':['Notifications','Example alerts and recent session activity.',eventList(3)],
 'add-device':['Add a device','MeshCentral typically adds computers through a device-group-specific agent installation link.',`<div class="split-notice">In production, this action would open the existing MeshCentral agent installer and invitation flow, preserving all platform options and permissions.</div><button class="btn" data-modalnav="groups">View device groups ${icon('arrowRight',14)}</button>`],
 'add-group':['New device group','Create a local example group in this design snapshot.',`<label for="groupName">Group name</label><input id="groupName" placeholder="e.g. Office computers" maxlength="42"/><label for="groupDesc">Description</label><input id="groupDesc" placeholder="Optional group description" maxlength="70"/><div class="sheet-actions"><button class="btn primary" data-action="save-group">Create example group</button></div>`],
 'new-folder':['Create folder','Add a folder to the simulated remote directory.',`<label for="folderName">Folder name</label><input id="folderName" placeholder="Folder name" maxlength="70"/><div class="sheet-actions"><button class="btn primary" data-action="save-folder">Create folder</button></div>`]
};
let [title,desc,body]=configs[state.modal]||['Design prototype','This control is represented as part of MeshCentral feature coverage. It needs the live MeshCentral server to execute.','<div class="split-notice">This snapshot demonstrates the navigation and interaction design. It does not perform administrative actions against a real device.</div>'];
portal.innerHTML=`<div class="sheet-backdrop" data-overlay="true"><div class="sheet" role="dialog" aria-modal="true" aria-label="${html(title)}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><h3>${html(title)}</h3><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('x',18)}</button></div><p>${html(desc)}</p>${body}${state.modal==='remote-settings'?`<div class="sheet-actions">${close}<button class="btn primary" data-action="save-remote-settings">Save settings</button></div>`:`<div class="sheet-actions">${close}</div>`}</div></div>`}
function downloadText(filename,data,type='text/plain'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),400)}
function action(act){switch(act){
case 'dock-devices':return route('devices');case 'dock-desktop':return openDevice(state.selected,'Desktop');case 'dock-activity':return route('activity');case 'dock-more':return modal('more-nav');
case 'search':return modal('search');case 'notifications':return modal('notifications');case 'about':return modal('about');
case 'device-desktop':return tab('Desktop');case 'device-terminal':return tab('Terminal');case 'device-files':return tab('Files');
case 'goto-terminal':return openDevice('workstation','Terminal');case 'toggle-grid':state.grid=!state.grid;return render();case 'clear-filters':state.filter='All';state.search='';return render();
case 'toggle-connect':state.connected=!state.connected;render();return setToast(state.connected?'Demo desktop connected':'Demo desktop disconnected');
case 'connection-method':return modal(act);case 'save-method':state.method=document.getElementById('methodSel')?.value||state.method;state.modal=null;render();return setToast(state.method+' selected for demo');case 'remote-settings':return modal(act);case 'special-keys':return modal(act);case 'keyboard':state.keyboard=!state.keyboard;render();if(state.keyboard){document.getElementById('mobileText')?.focus()}return;
case 'left-click':return setToast('Left click sent (simulation)');case 'right-click':return setToast('Right click sent (simulation)');
case 'mode':state.mouseMode=state.mouseMode==='trackpad'?'direct':'trackpad';render();return setToast(state.mouseMode==='trackpad'?'Trackpad: drag to pan':'Direct touch: tap to click');
case 'zoom-in':return zoom(.2);case 'zoom-out':return zoom(-.2);
case 'fullscreen':{const e=document.getElementById('remoteStage');if(document.fullscreenElement){document.exitFullscreen?.();return}e?.requestFullscreen?.().catch(()=>setToast('Fullscreen is unavailable in this browser'));return}
case 'screenshot':return downloadText('meshcentral-demo-desktop.svg',`<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#164582"/><stop offset="1" stop-color="#5aa3e6"/></linearGradient></defs><rect width="1280" height="720" fill="url(#g)"/><rect x="390" y="125" width="520" height="430" fill="#f8fbff" rx="10"/><rect x="390" y="125" width="520" height="48" fill="#e6effa" rx="10"/><text x="420" y="158" font-size="22" fill="#293f58">File Explorer</text><text x="435" y="225" font-size="28" fill="#375571">Documents</text><text x="435" y="285" font-size="28" fill="#375571">Downloads</text><rect y="680" width="1280" height="40" fill="#dfe9f7"/></svg>`,'image/svg+xml');
case 'share-session':return modal('share-session');case 'message':return modal('message');case 'power-options':return modal('power-options');case 'more-actions':return modal('more-actions');
case 'clear-terminal':state.term=[];return render();case 'download-events':return downloadText('meshcentral-demo-events.csv','Event,Device,Time\n'+events.map(e=>`"${e.text}","${e.device}","${e.time}"`).join('\n'),'text/csv');
case 'upload':document.getElementById('hiddenUpload')?.click();return;case 'new-folder':return modal('new-folder');
case 'add-group':return modal('add-group');case 'add-device':return modal('add-device');
case 'save-remote-settings':state.quality=document.getElementById('qualitySel')?.value||state.quality;state.fps=document.getElementById('fpsSel')?.value||state.fps;state.modal=null;render();return setToast('Demo streaming preferences saved');
case 'save-group':{let n=document.getElementById('groupName')?.value.trim();if(!n)return setToast('Enter a group name');if(groups.some(g=>g.name.toLowerCase()===n.toLowerCase()))return setToast('Group name already exists');groups.push({name:n,desc:document.getElementById('groupDesc')?.value.trim()||'Custom device group',count:0,icon:'layers'});state.modal=null;state.route='groups';render();return setToast('Sample group created')}
case 'save-folder':{let n=document.getElementById('folderName')?.value.trim();if(!n)return setToast('Enter a folder name');if(!fileSystem[state.filePath])fileSystem[state.filePath]=[];if(fileSystem[state.filePath].some(f=>f.name===n))return setToast('Folder already exists');fileSystem[state.filePath].push({name:n,folder:true});fileSystem[state.filePath+'/'+n]=[];state.modal=null;render();return setToast('Sample folder created')}
case 'close-modal':state.modal=null;return renderPortal();
default:return modal(act);
}}
function zoom(delta){state.zoom=Math.min(3,Math.max(.7,Math.round((state.zoom+delta)*10)/10));const el=document.getElementById('remoteViewport');if(el)el.style.setProperty('--zoom',state.zoom);const tag=document.querySelector('.remote-footer .chip');if(tag)tag.textContent=Math.round(state.zoom*100)+'%';}
function terminalCommand(cmd){const c=cmd.trim();if(!c)return;state.term.push({type:'cmd',text:c});const k=c.toLowerCase();let s=k==='help'?'Available demo commands: help, hostname, whoami, dir, ls, pwd, ipconfig, date, cls, clear':k==='hostname'?dev().host:k==='whoami'?'demo\\administrator':k==='dir'||k==='ls'?'Documents     Downloads     readme.txt':k==='pwd'?'C:\\Users\\Public':k==='ipconfig'?'IPv4 Address . . . . . . . : '+dev().ip:k==='date'?(new Date()).toLocaleString():k==='cls'||k==='clear'?null:'This is a local demo. Try “help” for available commands.';if(s===null){state.term=[]}else state.term.push({type:'output',text:s});render();document.getElementById('termInput')?.focus()}
// Event delegation preserves the sample state across concept changes.
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target){if(e.target.dataset.overlay){state.modal=null;renderPortal()}return}if(target.dataset.switch){selectConcept(target.dataset.switch);return}if(target.dataset.viewport){state.viewport=target.dataset.viewport;state.rotation=state.viewport==='landscape';refreshSwitchers();return}if(target.dataset.nav){route(target.dataset.nav);return}if(target.dataset.tab){tab(target.dataset.tab);return}if(target.dataset.device){openDevice(target.dataset.device);return}if(target.dataset.filter){state.filter=target.dataset.filter;render();return}if(target.dataset.path){state.filePath=target.dataset.path;render();return}if(target.dataset.file){if(target.dataset.folder==='true'){state.filePath+='/'+target.dataset.file;render()}else downloadText(target.dataset.file,`Illustrative demo content for ${target.dataset.file}\nThis is not a downloaded file from any remote device.`);return}if(target.dataset.group){state.filter='All';state.search=target.dataset.group;route('devices');return}if(target.dataset.action){action(target.dataset.action);return}if(target.dataset.key){let k=target.dataset.key;state.keys.has(k)?state.keys.delete(k):state.keys.add(k);render();return}if(target.dataset.sendkey){state.modal=null;renderPortal();setToast(`${target.dataset.sendkey} sent (simulation)`);return}if(target.dataset.demo){state.modal=null;renderPortal();setToast(`${target.dataset.demo} — demonstration only`);return}if(target.dataset.modalnav){state.modal=null;route(target.dataset.modalnav);return}if(target.dataset.result){let [t,id]=target.dataset.result.split(':');state.modal=null;if(t==='device')openDevice(id);else route(id);return}});
document.addEventListener('input',e=>{if(e.target.id==='deviceSearch'){state.search=e.target.value;const a=e.target.selectionStart;render();let el=document.getElementById('deviceSearch');el?.focus();el?.setSelectionRange(a,a)}if(e.target.id==='modalSearch'){state.modalQuery=e.target.value;const a=e.target.selectionStart;renderPortal();let el=document.getElementById('modalSearch');el?.focus();el?.setSelectionRange(a,a)}});
document.addEventListener('change',e=>{if(e.target.id==='settingsConcept')selectConcept(e.target.value);if(e.target.id==='hiddenUpload'){const names=[...e.target.files].map(f=>({name:f.name,folder:false,size:((f.size/1024)||0).toFixed(1)+' KB'}));if(state.filePath!=='C:/Users/Public/Downloads'){state.filePath='C:/Users/Public/Downloads'}state.uploads.push(...names);render();setToast(`${names.length} file(s) added to example Downloads folder — not uploaded to a server`)}});
document.addEventListener('submit',e=>{if(e.target.id==='termForm'){e.preventDefault();terminalCommand(document.getElementById('termInput')?.value||'')}if(e.target.id==='keyboardForm'){e.preventDefault();const t=document.getElementById('mobileText')?.value.trim();if(t)setToast(`Text sent (${t.length} characters, simulation)`);state.keys.clear()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderPortal();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal('search');return}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!state.modal){e.preventDefault();modal('search')}});
// Pointer-based pan, tap, and pinch on the illustrative remote screen.
const pointers=new Map();let gesture=null;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#remoteViewport')||!state.connected)return;const stage=document.getElementById('remoteStage');if(!stage)return;stage.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,fromX:e.clientX,fromY:e.clientY});if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY,zoom:state.zoom,move:0};if(pointers.size===2){let p=[...pointers.values()];gesture={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:state.zoom,panX:state.panX,panY:state.panY,move:0}}});
document.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;let p=pointers.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;const viewport=document.getElementById('remoteViewport');if(!viewport)return;if(pointers.size===2&&gesture.distance){let ps=[...pointers.values()];let newDist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);state.zoom=Math.max(.7,Math.min(3,gesture.zoom*newDist/gesture.distance));viewport.style.setProperty('--zoom',state.zoom);gesture.move=10}else if(pointers.size===1&&state.mouseMode==='trackpad'){state.panX=Math.max(-270,Math.min(270,gesture.panX+e.clientX-gesture.x));state.panY=Math.max(-170,Math.min(170,gesture.panY+e.clientY-gesture.y));viewport.style.setProperty('--pan-x',state.panX+'px');viewport.style.setProperty('--pan-y',state.panY+'px');gesture.move=Math.abs(e.clientX-gesture.x)+Math.abs(e.clientY-gesture.y)}});
document.addEventListener('pointerup',e=>{if(!pointers.has(e.pointerId))return;const moved=gesture?.move||0;pointers.delete(e.pointerId);if(pointers.size===0){if(moved<8&&state.mouseMode==='direct'&&e.pointerType==='touch')setToast('Remote left click (simulation)');gesture=null}});
document.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size)gesture=null});
document.getElementById('lab-logo').innerHTML=icon('layers',21);document.querySelector('.ic-desktop').innerHTML=icon('monitor',15);document.querySelector('.ic-phone').innerHTML=icon('smartphone',15);document.querySelector('.ic-landscape').innerHTML=icon('rotate',15);
render();
</script>
</body>
</html>
